[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silo"
version = "0.1.0"
description = "Research-only AI trading lab: backtesting and paper trading, never real money."
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyarrow>=14"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
silo = "silo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
